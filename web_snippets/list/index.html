  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif
    }

    body {
      background: #f7f9fc;
      color: #333;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #446084
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 10px #00000010;
      margin-bottom: 16px
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f3f7
    }

    .task-item:last-child {
      border-bottom: none
    }

    .task-item input[type=checkbox] {
      width: 20px;
      height: 20px;
      margin-right: 12px
    }

    .task-done {
      text-decoration: line-through;
      color: #999
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 10px
    }

    .cal-day {
      aspect-ratio: 1/1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: #f1f3f7
    }

    .cal-day.done {
      background: #7e9cd5;
      color: white
    }

    .cal-day.today {
      border: 2px solid #7e9cd5
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #7e9cd5;
      color: white;
      font-size: 14px
    }

    button.gray {
      background: #b8c7dd
    }

    .month-title {
      text-align: center;
      margin: 8px 0;
      font-weight: bold
    }
  </style>
</head>

<body>
  <h1>📑 学习打卡</h1>
  <div class="card">
    <div id="taskList"></div>
    <div class="btns">
      <button onclick="saveAll()">保存</button>
      <button onclick="exportData()">导出备份</button>
      <button onclick="importData()">导入恢复</button>
      <button class="gray" onclick="resetToday()">重置今日</button>
    </div>
  </div>
  <div class="card">
    <div class="month-title" id="monthTitle"></div>
    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    const TASKS = [
      { id: "t1", name: "学习2个单元" },
      { id: "t2", name: "复习" },
      { id: "t3", name: "1篇练习" },
      { id: "t4", name: "30个单词" },
      { id: "t5", name: "整理固定搭配3个" },
      { id: "t6", name: "AI生成文章" },
      { id: "t7", name: "写一点策划案" }
    ];

    let data = JSON.parse(localStorage.getItem("studyCheckData")) || {};

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderTasks() {
      const today = getTodayKey();
      const todayData = data[today] || {};
      const wrap = document.getElementById("taskList");
      wrap.innerHTML = "";
      TASKS.forEach(t => {
        const div = document.createElement("div");
        div.className = "task-item";
        if (todayData[t.id]) div.classList.add("task-done");
        div.innerHTML = `
      <input type="checkbox" id="${t.id}" ${todayData[t.id] ? "checked" : ""}>
      <label for="${t.id}">${t.name}</label>
    `;
        const cb = div.querySelector("input");
        cb.onchange = () => {
          if (!data[today]) data[today] = {};
          data[today][t.id] = cb.checked;
          saveAll();
          renderTasks();
          renderCalendar();
        }
        wrap.appendChild(div);
      })
    }

    function renderCalendar() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      document.getElementById("monthTitle").textContent = `${y}年${m + 1}月`;
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const wrap = document.getElementById("calendar");
      wrap.innerHTML = "";
      const weekNames = ["一", "二", "三", "四", "五", "六", "日"];
      weekNames.forEach(w => {
        const s = document.createElement("div");
        s.className = "cal-day";
        s.style.background = "none";
        s.textContent = w;
        wrap.appendChild(s);
      })
      const startWeek = first.getDay() || 7;
      for (let i = 1; i < startWeek; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-day";
        wrap.appendChild(empty);
      }
      for (let d = 1; d <= last.getDate(); d++) {
        const dayKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement("div");
        cell.className = "cal-day";
        if (data[dayKey]) cell.classList.add("done");
        if (d === now.getDate()) cell.classList.add("today");
        cell.textContent = d;
        wrap.appendChild(cell);
      }
    }

    function saveAll() {
      localStorage.setItem("studyCheckData", JSON.stringify(data));
    }

    function resetToday() {
      const k = getTodayKey();
      delete data[k];
      saveAll();
      renderTasks();
      renderCalendar();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "study-check-backup.json";
      a.click();
    }

    function importData() {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".json";
      inp.onchange = e => {
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = ev => {
          try {
            data = JSON.parse(ev.target.result);
            saveAll();
            renderTasks();
            renderCalendar();
            alert("导入成功");
          } catch (err) { alert("文件读取失败") }
        }
        r.readAsText(f);
      }
      inp.click();
    }

    renderTasks();
    renderCalendar();
  </script>
</body>

</html>
